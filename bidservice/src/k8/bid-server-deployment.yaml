apiVersion: apps/v1
kind: Deployment
metadata:
  name: bid-server-deployment
  labels:
    app: bid-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bid-server
  template:
    metadata:
      labels:
        app: bid-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bid-server
          image: samnayak1/bidservice:2.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8082
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: bid-service-config
                  key: POSTGRES_HOST
            - name: AUTH_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: bid-service-config
                  key: AUTH_SERVICE_HOST
            - name: CATALOG_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: bid-service-config
                  key: CATALOG_SERVICE_HOST
            - name: GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: bid-service-config
                  key: GATEWAY_URL
            - name: KAFKA_BROKER_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: bid-service-config
                  key: KAFKA_BROKER_SERVICE
            - name: KAFKA_CLIENT_JAAS_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: bid-service-config
                  key: KAFKA_CLIENT_JAAS_CONFIG
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bid-secret
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bid-secret
                  key: KAFKA_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: bid-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bid-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bid-secret
                  key: POSTGRES_PASSWORD
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "50m"
      volumes:
        - name: tmp
          emptyDir: {}