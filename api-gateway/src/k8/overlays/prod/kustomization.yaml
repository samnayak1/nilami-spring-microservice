apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - issuer.yaml

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: app-ingress

configMapGenerator:
  - name: gateway-config
    behavior: merge
    literals:
      - ALLOWED_CLIENT_HOSTS=https://nilami.click,https://www.nilami.click